# Site identity
lang: fr
timezone: Africa/Lome
title: "KOUDADZE Kodjogan Josias"
tagline: "Cybersécurité, réseaux et développement Python"
description: >-
  Blog et portfolio personnel de Koudadze Kodjogan Josias, étudiant en cybersécurité,
  administrateur réseau et développeur Python au Togo.
url: "https://koudadzejosias-wq.github.io"
baseurl: ""

github:
  username: koudadzejosias-wq

theme: jekyll-theme-chirpy

# Profile
avatar: "/assets/img/profile.jpeg"
social_preview_image: "/assets/img/profile.jpeg"
social:
  name: "KOUDADZE Kodjogan Josias"
  email: ""
  links:
    - "https://github.com/koudadzejosias-wq"
    - "https://www.linkedin.com/in/koudadze-josias/"

# Theme behavior
paginate: 10
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

toc: true
comments:
  provider: false

# Collections and navigation
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Build
plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - .jekyll-cache
  - .sass-cache

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
